name: Deploy to FTP (main)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ftp-deploy-main
  cancel-in-progress: true

# one.com only accepts implicit FTP over TLS on port 990 and needs the hostname sent via SNI
# (without SNI the server answers with TLS alert 80). SamKirkland/FTP-Deploy-Action does not
# send SNI, so the upload uses lftp, which does.
env:
  FTP_HOST: ftp.covfo2us1.service.one
  FTP_USERNAME: covfo2us1_u
  # web root of the site (the FTP login lands one level above webroots/)
  FTP_DIR: /webroots/sites/baarsglasengevelwerken.nl/

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Upload over FTPS
        env:
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        # Uploads everything except the excludes; never deletes files on the server.
        run: |
          if [ -z "$LFTP_PASSWORD" ]; then echo "::error::Secret FTP_PASSWORD is empty or missing"; exit 1; fi
          if [ "$LFTP_PASSWORD" != "$(printf '%s' "$LFTP_PASSWORD" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')" ]; then
            echo "::error::Secret FTP_PASSWORD starts or ends with a space or line break; re-enter it without"; exit 1
          fi
          lftp --env-password -u "$FTP_USERNAME" "ftps://$FTP_HOST:990" <<EOF
          set ssl:verify-certificate yes
          set ftp:ssl-protect-data yes
          set ftp:passive-mode yes
          set net:timeout 30
          set net:max-retries 3
          set net:reconnect-interval-base 5
          mirror --reverse --verbose --parallel=4 \
            --exclude-glob .git/ \
            --exclude-glob .github/ \
            --exclude-glob .claude/ \
            --exclude-glob .vscode/ \
            --exclude-glob tools/ \
            --exclude-glob email/ \
            --exclude-glob logs/ \
            --exclude-glob research/ \
            --exclude-glob assets/scss/ \
            --exclude-glob assets/fonts/ \
            --exclude-glob .gitignore \
            --exclude-glob "*.md" \
            --exclude-glob "*.ps1" \
            --exclude-glob "README*" \
            --exclude-glob "assets/images/dak-impregneren-*.png" \
            ./ "$FTP_DIR"
          quit
          EOF
