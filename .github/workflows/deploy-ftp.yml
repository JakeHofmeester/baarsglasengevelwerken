name: Deploy to FTP (main)

on:
  push:
    branches: ["main"]

concurrency:
  group: ftp-deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: FTP Deploy
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          # web root of the site on one.com (the FTP login lands one level above webroots/)
          server-dir: /webroots/sites/baarsglasengevelwerken.nl/
          local-dir: ./
          dangerous-clean-slate: false
          exclude: |
            **/.git*/**
            **/.gitignore
            **/.github/**
            **/.claude/**
            **/assets/scss/**
            **/assets/fonts/**
            **/assets/images/dak-impregneren-*.png
            **/.vscode/**
            **/tools/**
            **/*.ps1
            **/*.md
            **/README*
            **/email/**
            **/logs/**
            **/research/**

